<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghost Editor Adapter demo</title>
  <link rel="stylesheet" href="../dist/ghost-editor-adapter.css">
  <style>
    body { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; font: 16px/1.5 system-ui, sans-serif; }
    img { display: block; max-width: 100%; max-height: 55vh; margin: 1rem 0; }
    button, input { font: inherit; }
  </style>
</head>
<body>
  <h1>Ghost Editor Adapter demo</h1>
  <p>Select a local image, then open the editor. The demo uses an object URL so CDN/image CORS cannot affect the test.</p>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
  <button id="edit" type="button" disabled>Edit image</button>
  <img id="preview" alt="Edited preview" hidden>

  <script type="module">
    import {openDefaultEditor} from '../dist/ghost-editor-adapter.js';

    const input = document.querySelector('#file');
    const edit = document.querySelector('#edit');
    const preview = document.querySelector('#preview');
    let sourceUrl = '';

    input.addEventListener('change', () => {
      if (sourceUrl) URL.revokeObjectURL(sourceUrl);
      const [file] = input.files;
      sourceUrl = file ? URL.createObjectURL(file) : '';
      edit.disabled = !sourceUrl;
      preview.hidden = !sourceUrl;
      if (sourceUrl) preview.src = sourceUrl;
    });

    edit.addEventListener('click', () => {
      const editor = openDefaultEditor({src: sourceUrl});
      editor.on('process', ({dest}) => {
        if (sourceUrl) URL.revokeObjectURL(sourceUrl);
        sourceUrl = URL.createObjectURL(dest);
        preview.src = sourceUrl;
        preview.hidden = false;
      });
    });
  </script>
</body>
</html>
